name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85

      - name: Build
        run: cargo build --release

      - name: Package Binary
        run: |
          mkdir -p bin
          cp target/release/macgpu bin/
          tar -czvf macgpu-macos-arm64.tar.gz -C bin macgpu

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: macgpu-macos-arm64.tar.gz
          generate_release_notes: true
