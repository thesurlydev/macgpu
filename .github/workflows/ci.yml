name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --workspace --verbose

      - name: Check the report schema builds for Linux
        run: cargo check -p macgpu-model --target x86_64-unknown-linux-gnu

      - name: Run Tests
        run: cargo test --workspace
