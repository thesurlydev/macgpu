[workspace]
members = [".", "crates/macgpu-core", "crates/macgpu-model"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/thesurlydev/macgpu"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
macgpu-core = { path = "crates/macgpu-core" }
macgpu-model = { path = "crates/macgpu-model" }
objc2-foundation = "0.3"
objc2-metal = "0.3"
serde = { version = "1", features = ["derive"] }

# Lint baseline; repo-specific lints below it.
[workspace.lints.clippy]
# Left-in debugging and stubs. No repo had any; the lints keep it that way.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Panics. unwrap() says nothing about why it cannot fail; expect() with the invariant is allowed.
unwrap_used = "warn"

# Suppressions and unsafe. #[expect] warns once the lint stops firing; #[allow] never does.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
mem_forget = "warn"

# Ownership and allocation.
redundant_clone = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
needless_collect = "warn"
or_fun_call = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
large_types_passed_by_value = "warn"
large_stack_arrays = "warn"
rc_buffer = "warn"

# API shape and async.
ref_option = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

[package]
name = "macgpu"
version.workspace = true
edition.workspace = true
description = "Apple Silicon GPU monitor with per-process and per-app usage, power attribution, memory, thermals, and Prometheus export"
license.workspace = true
repository.workspace = true
categories = ["cli", "system", "monitoring"]
keywords = ["apple-silicon", "gpu", "macos", "monitoring"]
readme = "README.md"
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc.workspace = true
macgpu-core.workspace = true
macgpu-model.workspace = true
objc2 = "0.6"
objc2-foundation.workspace = true
objc2-metal.workspace = true
ratatui = "0.30"
serde.workspace = true
serde_json = "1"
tiny_http = "0.12"

[profile.release]
lto = "thin"
strip = true
