description = """
What happens when h1's idea of the context window differs from the server's.
unset is what an h1 user gets with a model h1 has no entry for: no
compaction. assume-32k is the value from h1's config examples. server uses
the context length the server reports, with compaction scaled to fit. The
notes under the summary say whether requests reached or passed the length
the server reports (a server that enforces it truncates without an error)
and how many runs compacted. Run it once with the server's default context
and once after raising it.
"""
tasks = ["fix-bug", "fix-noisy-test"]
repeats = 2

[[variant]]
name = "unset"

[[variant]]
name = "assume-32k"
context_window = 32768

[[variant]]
name = "server"
context_window = "server"
