description = """
A/B two h1 binaries on the same tasks, for checking that a change to h1
helps (or does not hurt) on local models. installed is the h1 on PATH; dev
is a build in a sibling checkout (paths are relative to the macgpu repo).
Build it first with `cargo build --release` in ../h1.
"""
tasks = ["explain-function", "fix-bug", "fix-noisy-test"]
repeats = 3

[[variant]]
name = "installed"
h1 = "h1"

[[variant]]
name = "dev"
h1 = "../h1/target/release/h1"
