description = """
What each part of h1's advertised surface costs a local model in prompt
tokens and prefill energy. default has the built-in tools; no-tools sends
only ask_user and a minimal prompt; user-home runs with your real HOME, so
your plugins, skills, and memory index from ~/.h1 and ~/.claude are
advertised too. The task needs no tools, so every variant can pass.
Interleaved order means some runs miss the server's prompt cache and some
hit it, so medians mix the two. In runs.csv, the runs with few cached tokens
show the wait before the first token of a new session.
"""
tasks = ["explain-stdin"]
repeats = 3

[[variant]]
name = "default"

[[variant]]
name = "no-tools"
args = ["--no-tools"]

[[variant]]
name = "user-home"
home = "user"
