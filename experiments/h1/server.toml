# Which model server the lab drives, and how to find it in macgpu.
# Put machine-specific overrides in server.local.toml (not tracked); its keys
# replace these.

# h1 provider profile name. ollama and lmstudio are built in; any other name
# (omlx, for example) gets a [providers.<name>] table with base_url below.
provider = "ollama"
base_url = "http://localhost:11434/v1"

# Empty means the first chat model the server lists.
model = ""

# Substring of the server's app row in `macgpu -g app --once`, matched
# case-insensitively against the app name and bundle path.
# Ollama: "ollama". LM Studio: "lm studio". omlx: "omlx".
app = "ollama"

# A bare name is looked up on PATH; a path is relative to the macgpu repo.
h1 = "h1"
macgpu = "target/release/macgpu"

# macgpu sampling window in seconds. macgpu splits GPU energy among apps over
# a trailing span of at least 0.9 s (the kernel credits app energy in steps
# about 0.5 s apart), so windows much shorter than 0.5 s add samples without
# making the prefill and decode split sharper.
interval = 0.5

# Seconds to wait between runs, so one run's tail does not land in the next.
settle = 2
