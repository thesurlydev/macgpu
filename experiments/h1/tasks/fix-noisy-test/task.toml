description = "Fix a bug when the test run prints about 120 KB of log noise (tool output cap)"
prompt = "Run the test suite with `python3 -m unittest` and fix the bug in inventory.py that makes a test fail. Do not change the tests."
check = "cmp -s test_inventory.py \"$TASK_DIR/files/test_inventory.py\" && python3 -m unittest -q 2>/dev/null >/dev/null"
timeout = 900
