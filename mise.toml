# macOS on Apple Silicon. Needs the Rust version in Cargo.toml's rust-version;
# the tasks use the toolchain on PATH rather than pinning one here.

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.install]
description = "Build the release binary and install it to ~/.local/bin"
run = """
cargo build --release
install -d "$HOME/.local/bin"
install -m 755 target/release/macgpu "$HOME/.local/bin/macgpu"
echo "installed $HOME/.local/bin/macgpu"
"""

[tasks.build-debug]
description = "Build the debug binary"
run = "cargo build"

[tasks.test]
description = "Run the unit tests and the non-ignored end-to-end tests; GPU-load tests are ignored"
run = "cargo test --workspace"

[tasks.test-unit]
description = "Run the unit tests only; fast and no GPU load"
run = "cargo test --workspace --lib"

[tasks.test-e2e]
description = "Run the end-to-end test binaries with their default, non-ignored tests; no GPU load"
run = "cargo test --test apps_e2e --test attribution --test export_cli --test power_e2e"

[tasks.test-hardware]
description = "Run all tests, including the ignored hardware tests that generate real GPU load"
run = "cargo test --workspace -- --include-ignored"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.clippy]
description = "Lint with Clippy, warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.check-model-linux]
description = "Check that the report schema crate builds for Linux, where remote readers run"
run = "cargo check -p macgpu-model --target x86_64-unknown-linux-gnu"

# `gate` is the name every repo uses for its full pre-commit check; `check`
# stays as an alias.
[tasks.gate]
description = "Run format, lint, the Linux schema check, and the full test suite"
alias = "check"
depends = ["fmt", "clippy", "check-model-linux", "test"]
